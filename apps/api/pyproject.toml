[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "opslens-api"
version = "0.2.0"
description = "Enterprise governed operations intelligence API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0", "pydantic>=2.8",
  "alembic>=1.13", "psycopg[binary]>=3.2", "PyJWT>=2.9", "python-multipart>=0.0.9",
  "sqlglot>=26.0"
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.15.20,<0.16", "mypy>=1.11", "types-PyJWT"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
ignore = ["E701", "E702", "F403", "F405"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
warn_return_any = false

[tool.ruff.lint.per-file-ignores]
"tests/test_api.py" = ["E402"]
"tests/test_phase3_workflows.py" = ["E402"]
