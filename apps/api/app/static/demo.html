<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpsLens AI — Synthetic Demo</title>
<style>
:root{--bg:#111313;--panel:#191c1b;--panel2:#202422;--line:#323733;--text:#f3f1e9;--muted:#9da39c;--green:#55c98a;--amber:#e8b25b;--red:#ef7771;--cream:#e8e3d7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:.01em}.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}.rail{border-right:1px solid var(--line);padding:24px 14px;background:#141615;position:sticky;top:0;height:100vh}.brand{font-size:21px;font-weight:760;letter-spacing:-.05em;display:flex;gap:9px;align-items:center;margin:0 10px 31px}.mark{width:22px;height:22px;border:2px solid var(--green);border-radius:5px;position:relative}.mark:after{content:"";position:absolute;width:6px;height:6px;background:var(--green);bottom:3px;right:3px;border-radius:2px}.ws{margin:0 10px 24px;padding:12px;border:1px solid var(--line);border-radius:8px;background:#1b1e1c}.eyebrow,.label{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}.ws b{display:block;margin-top:4px;font-size:12px}.nav{display:grid;gap:3px}.nav a{color:#b8bcb6;text-decoration:none;padding:10px 12px;border-radius:7px;display:flex;justify-content:space-between}.nav a.active,.nav a:hover{background:#252a27;color:var(--text)}.pill{font-size:10px;background:#303632;padding:2px 6px;border-radius:20px;color:var(--amber)}.rail-footer{position:absolute;bottom:18px;left:18px;right:18px;border-top:1px solid var(--line);padding-top:15px;color:var(--muted);font-size:11px}.content{padding:22px 30px 60px;max-width:1600px;margin:auto;width:100%}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.breadcrumb{color:var(--muted);font-size:12px}.top-actions{display:flex;align-items:center;gap:10px}.btn{background:#e6e2d6;color:#181a18;border:0;border-radius:7px;font-weight:700;padding:10px 13px;font-size:12px}.btn.dark{background:#262b28;color:#e9e6dc;border:1px solid var(--line)}.demo{padding:7px 10px;border:1px solid #536b59;background:#1d2c22;border-radius:6px;color:#a8d8b5;font-size:11px}.title-row{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.title{font-size:27px;letter-spacing:-.045em;font-weight:750;margin:0}.sub{color:var(--muted);margin:6px 0 0}.filters{display:flex;gap:7px}.filter{border:1px solid var(--line);padding:7px 10px;border-radius:6px;color:#cbc9bf;background:#181b19;font-size:11px}.grid{display:grid;gap:14px}.metrics{grid-template-columns:repeat(5,1fr)}.card{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:15px;min-width:0}.metric .value{font-size:26px;font-weight:740;letter-spacing:-.04em;margin:8px 0}.delta.up{color:var(--green)}.delta.down{color:var(--red)}.spark{height:26px;margin-top:9px;opacity:.8}.dash-grid{grid-template-columns:1.45fr .85fr;margin-top:14px}.wide{grid-template-columns:1fr 1fr;margin-top:14px}.card h3{font-size:14px;letter-spacing:-.02em;margin:0 0 2px}.card .helper{font-size:11px;color:var(--muted);margin:0 0 13px}.chart{height:210px;display:flex;align-items:end;gap:8px;padding:10px 0 0;border-bottom:1px solid #2e322f;position:relative;background:linear-gradient(transparent 49%,#222724 50%,transparent 51%)}.chart:before{content:"Revenue · last 6 weeks";position:absolute;top:2px;left:0;color:#868c85;font-size:10px}.bar{flex:1;background:linear-gradient(to top,#4daa76,#83d89d);border-radius:3px 3px 0 0;min-width:5px}.legend{display:flex;gap:14px;color:var(--muted);font-size:10px;margin-top:9px}.dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--green);margin-right:5px}.alert{border-bottom:1px solid #2d312e;padding:11px 0;display:flex;gap:10px}.alert:last-child{border:0}.severity{font-size:10px;padding-top:2px;width:49px;text-transform:uppercase;font-weight:700}.severity.critical{color:var(--red)}.severity.high{color:var(--amber)}.alert b{font-size:12px;display:block}.alert p{font-size:11px;color:var(--muted);margin:3px 0}.queue{display:grid;gap:7px}.queue-item{padding:10px;background:var(--panel2);border-radius:7px;border-left:3px solid var(--amber)}.queue-item strong{font-size:12px}.queue-item span{float:right;font-size:10px;color:#adb2aa}.queue-item p{font-size:11px;margin:4px 0 0;color:var(--muted)}table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.1em;padding:0 0 9px}td{font-size:12px;padding:10px 0;border-top:1px solid #2c302d}.tag{padding:3px 6px;border-radius:4px;font-size:10px;background:#26362b;color:#a9dfb7}.tag.warn{background:#3b301c;color:#f2c879}.tag.red{background:#412326;color:#ffaaa5}.copilot{display:grid;grid-template-columns:270px 1fr 335px;gap:14px;height:calc(100vh - 94px)}.panel{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:15px;overflow:auto}.thread{padding:10px;border-radius:7px;background:#262c28;margin:8px 0;font-size:12px}.suggest{font-size:11px;padding:10px;border:1px solid var(--line);border-radius:6px;margin-top:8px;color:#cecdc4}.message{max-width:770px;border:1px solid #38403a;background:#1f2421;padding:15px;border-radius:9px;margin:14px 0}.message .from{font-size:10px;color:var(--green);text-transform:uppercase;letter-spacing:.1em}.message p{margin:8px 0 0;font-size:13px}.statusline{display:flex;gap:6px;flex-wrap:wrap;margin:15px 0}.step{font-size:10px;border:1px solid #3a443c;background:#202922;padding:5px 7px;border-radius:20px;color:#b7d9be}.sql{font:11px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace;background:#111313;border:1px solid #303633;border-radius:7px;padding:12px;color:#d3ead8;white-space:pre-wrap}.check{font-size:11px;padding:8px 0;border-bottom:1px solid #2f342f;color:#b9c2b9}.check:before{content:"✓";color:var(--green);margin-right:7px}.hero{min-height:100vh;background:radial-gradient(circle at 80% 15%,#234231 0,transparent 31%),#111313}.landing-nav{max-width:1180px;margin:auto;display:flex;justify-content:space-between;padding:25px 0}.hero-inner{max-width:1180px;margin:75px auto 0;display:grid;grid-template-columns:1fr .9fr;gap:62px;align-items:center}.hero h1{font-size:55px;line-height:.98;letter-spacing:-.06em;margin:15px 0 22px}.hero p{color:#b7beb6;font-size:16px;max-width:580px}.badgeh{color:#9bddae;text-transform:uppercase;letter-spacing:.13em;font-size:11px}.mock{background:#171a18;border:1px solid #3e4d43;border-radius:14px;padding:13px;box-shadow:0 30px 80px #05060688}.mock-top{font-size:10px;color:#9da39c;margin-bottom:12px}.mockgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.m{border:1px solid #333a36;border-radius:6px;padding:10px;font-size:10px}.m b{display:block;font-size:18px;margin-top:5px}.section{max-width:1180px;margin:110px auto}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.tile{border:1px solid var(--line);padding:18px;border-radius:9px;background:#181b19}.tile b{font-size:14px}.tile p{color:var(--muted);font-size:12px}.view{display:none}.view.active{display:block}@media(max-width:1000px){.shell{grid-template-columns:1fr}.rail{display:none}.metrics{grid-template-columns:repeat(2,1fr)}.dash-grid,.wide,.hero-inner,.copilot{grid-template-columns:1fr;height:auto}.content{padding:18px}.hero-inner,.landing-nav,.section{margin-left:20px;margin-right:20px}.hero h1{font-size:42px}}
</style></head><body><div id="app"></div><script>
const $=s=>document.querySelector(s); const bars=[38,55,48,66,72,60,84,76,91,83,98,87,75,94,89,100,82,103,96,112,102,120,108,129,119,126,143,134,152,140,161,150,168,158,176,164,183,171,191,178,201,188];
function shell(body,active='Overview'){return `<div class="shell"><aside class="rail"><div class="brand"><i class="mark"></i>OpsLens AI</div><div class="ws"><span class="eyebrow">Workspace</span><b>Northwind Retail Group</b><span style="color:#8da494;font-size:10px">● Synthetic demo warehouse</span></div><nav class="nav">${['Overview','AI Operations','Inventory Risk','Margin & Sales','Investigations','Data Sources','Governance'].map(x=>`<a class="${x==active?'active':''}" href="#${x.toLowerCase().replaceAll(' ','-')}">${x}${x==='Inventory Risk'?'<span class="pill">14</span>':''}</a>`).join('')}</nav><div class="rail-footer">Governed decision intelligence<br>v0.1 · Demo mode</div></aside><main class="content"><div class="top"><div class="breadcrumb">Northwind Retail Group / <span>${active}</span></div><div class="top-actions"><span class="demo">Synthetic data · no production actions</span><button class="btn dark">Export</button><button class="btn">Start investigation</button></div></div>${body}</main></div>`}
function overview(){return shell(`<section class="title-row"><div><h1 class="title">Executive overview</h1><p class="sub">Today’s verified operating signals, certified metrics, and attention queue.</p></div><div class="filters"><span class="filter">Last 30 days</span><span class="filter">All branches</span><span class="filter">All categories</span></div></section><div class="grid metrics">${[['Revenue','PKR 29.84M','+8.4%','up'],['Gross margin','27.6%','−2.1 pts','down'],['Inventory value','PKR 18.32M','+1.8%','up'],['Stockout risk','14 SKUs','+12.0%','down'],['Return rate','3.8%','+0.7 pts','down']].map(x=>`<article class="card metric"><span class="label">${x[0]}</span><div class="value">${x[1]}</div><span class="delta ${x[3]}">${x[2]} vs prior period</span><svg class="spark" viewBox="0 0 100 25" preserveAspectRatio="none"><polyline fill="none" stroke="${x[3]=='up'?'#55c98a':'#ef7771'}" stroke-width="2" points="0,18 15,13 28,16 42,10 58,15 70,7 86,11 100,3"/></svg></article>`).join('')}</div><div class="grid dash-grid"><article class="card"><h3>Revenue trend</h3><p class="helper">Net realized revenue · 6-week view</p><div class="chart">${bars.map(x=>`<div class="bar" style="height:${x/2}px"></div>`).join('')}</div><div class="legend"><span><i class="dot"></i>Current period</span><span>PKR 29.84M verified revenue</span></div></article><article class="card"><h3>What changed?</h3><p class="helper">AI-grounded summary · Evidence attached</p><div class="alert"><span class="severity critical">Critical</span><div><b>Thin stock cover across 14 high-velocity SKUs</b><p>Exposure is concentrated in Islamabad and Lahore. Supplier lead time raises urgency.</p></div></div><div class="alert"><span class="severity high">High</span><div><b>Consumer Electronics margin declined</b><p>Discount intensity rose while landed costs remained elevated.</p></div></div><div class="alert"><span class="severity high">High</span><div><b>Islamabad return pattern is abnormal</b><p>Damaged-on-arrival returns are 2.4× the peer baseline.</p></div></div></article></div><div class="grid wide"><article class="card"><h3>Branch comparison</h3><p class="helper">Revenue and gross margin · certified metrics</p><table><thead><tr><th>Branch</th><th>Revenue</th><th>Margin</th><th>Signal</th></tr></thead><tbody>${[['Lahore Branch','PKR 7.12M','30.4%','Healthy'],['Islamabad Branch','PKR 6.83M','24.1%','Watch'],['Karachi Branch','PKR 6.38M','29.7%','Healthy'],['Rawalpindi Branch','PKR 5.21M','28.2%','Healthy']].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td><span class="tag ${r[3]=='Watch'?'warn':''}">${r[3]}</span></td></tr>`).join('')}</tbody></table></article><article class="card"><h3>What needs attention today?</h3><p class="helper">Prioritized by business impact and confidence</p><div class="queue">${[['Critical','Review reorder recommendations','14 SKUs below seven days cover'],['High','Open margin investigation','Discount and landed-cost pressure'],['High','Escalate NorthStar Imports','Open POs 5.2 days late']].map(q=>`<div class="queue-item"><span>${q[0]}</span><strong>${q[1]}</strong><p>${q[2]}</p></div>`).join('')}</div></article></div>`, 'Overview')}
function copilot(){return shell(`<div class="copilot"><aside class="panel"><span class="label">Conversations</span><div class="thread">Margin decline investigation<br><small style="color:#9da39c">Today · 4 evidence sets</small></div><div class="thread" style="background:#1d201e">Inventory risk weekly review<br><small style="color:#9da39c">Yesterday</small></div><br><span class="label">Suggested questions</span>${['Why did gross margin decline last week?','Which products are likely to stock out within 14 days?','Which branches have abnormal returns?','Which suppliers are causing margin erosion?'].map(x=>`<div class="suggest">${x}</div>`).join('')}</aside><section class="panel"><span class="label">Governed AI analysis</span><div class="message"><span class="from">You</span><p>Which products are likely to stock out within 14 days?</p></div><div class="statusline">${['Understanding question','Approved metrics','Safe query','SQL validation','Evidence','Grounded answer'].map(x=>`<span class="step">✓ ${x}</span>`).join('')}</div><div class="message"><span class="from">OpsLens AI · 91% confidence</span><p><b>14 branch-SKU combinations are below their reorder point.</b> The most urgent exposure is concentrated in Islamabad and Lahore. Prioritize the first five SKUs, then validate open supplier POs before approval.</p><p style="font-size:11px;color:#9da39c">Evidence: inventory_records, products, branches · Certified metrics: Stock cover, Stockout risk</p></div><table><thead><tr><th>SKU</th><th>Product</th><th>Branch</th><th>Cover</th><th>Risk</th></tr></thead><tbody>${[['OPS-1037','Consumer Electronics Plus 38','Islamabad','2.3 days','Critical'],['OPS-1053','Home Appliances Essential 54','Lahore','3.1 days','Critical'],['OPS-1074','Mobile Accessories Pro 75','Islamabad','4.4 days','High']].map(r=>`<tr>${r.map((x,i)=>`<td>${i==4?`<span class="tag ${x=='Critical'?'red':'warn'}">${x}</span>`:x}</td>`).join('')}</tr>`).join('')}</tbody></table></section><aside class="panel"><span class="label">SQL evidence</span><p class="helper">Executed with read-only database role</p><div class="sql">SELECT p.sku, p.name, b.name AS branch,\n i.available_units, p.reorder_point\nFROM inventory_records i\nJOIN products p ON p.id = i.product_id\nJOIN branches b ON b.id = i.branch_id\nWHERE i.available_units &lt;= p.reorder_point\nORDER BY i.available_units ASC\nLIMIT 24</div><p class="label" style="margin-top:16px">Validation result</p>${['SELECT-only statement','Allowed tables only','Explicit LIMIT 24','No external functions','5,000ms timeout budget'].map(x=>`<div class="check">${x}</div>`).join('')}<button class="btn" style="width:100%;margin-top:17px">Create investigation</button></aside></div>`, 'AI Operations')}
function inventory(){return shell(`<section class="title-row"><div><h1 class="title">Inventory risk center</h1><p class="sub">Stock cover, replenishment risk, and supplier lead-time exposure.</p></div><div class="filters"><span class="filter">All branches</span><span class="filter">Next 14 days</span></div></section><div class="grid metrics">${[['Stockout risk','14 SKUs','Critical','down'],['Reorder value','PKR 1.84M','12 recommendations','up'],['Slow-moving','PKR 2.16M','58 SKUs','down'],['Dead stock','PKR 0.72M','19 SKUs','down'],['Supplier delay','2 suppliers','5.2d avg','down']].map(x=>`<article class="card metric"><span class="label">${x[0]}</span><div class="value">${x[1]}</div><span class="delta ${x[3]}">${x[2]}</span></article>`).join('')}</div><div class="grid wide"><article class="card"><h3>Stockout forecast</h3><p class="helper">Sorted by days of cover, demand trend, and supplier lead time</p><table><thead><tr><th>SKU</th><th>Product</th><th>Branch</th><th>Cover</th><th>Recommended order</th><th>Risk</th></tr></thead><tbody>${[['OPS-1037','Consumer Electronics Plus 38','Islamabad','2.3d','118','Critical'],['OPS-1053','Home Appliances Essential 54','Lahore','3.1d','96','Critical'],['OPS-1074','Mobile Accessories Pro 75','Islamabad','4.4d','74','High'],['OPS-1185','Audio Core 186','Karachi','5.2d','65','High'],['OPS-1222','Kitchenware Plus 223','Rawalpindi','6.3d','52','High']].map(r=>`<tr>${r.map((x,i)=>`<td>${i==5?`<span class="tag ${x=='Critical'?'red':'warn'}">${x}</span>`:x}</td>`).join('')}</tr>`).join('')}</tbody></table></article><article class="card"><h3>Supplier lead-time risk</h3><p class="helper">Procurement confidence before action</p>${[['NorthStar Imports','12d','71%','86'],['Meridian Supply','11d','83%','72'],['Vertex Distribution','9d','91%','54'],['Prime Route','8d','94%','39']].map(r=>`<div class="alert"><span class="severity high">${r[3]}</span><div><b>${r[0]}</b><p>${r[1]} lead time · ${r[2]} on-time delivery</p></div></div>`).join('')}</article></div><div class="grid wide"><article class="card"><h3>Branch inventory heatmap</h3><p class="helper">Dark amber cells need action</p><div style="display:grid;grid-template-columns:120px repeat(5,1fr);gap:6px;font-size:11px;align-items:center">${['','Islamabad','Lahore','Karachi','Rawalpindi','Faisalabad','Consumer electronics','Home appliances','Computing','Audio','Kitchenware'].map((x,i)=>i<6?`<b style="color:#aeb4ad;font-size:10px">${x}</b>`:`<span>${x}</span><i style="height:28px;background:${i%2?'#5b3523':'#343c30'};border-radius:4px"></i><i style="height:28px;background:#4d3124;border-radius:4px"></i><i style="height:28px;background:#2c4b35;border-radius:4px"></i><i style="height:28px;background:#365740;border-radius:4px"></i><i style="height:28px;background:#426345;border-radius:4px"></i>`).join('')}</div></article><article class="card"><h3>Recommended action</h3><p class="helper">Action is approval-gated</p><div class="queue-item"><span>Priority 1</span><strong>Place a constrained PO for 5 SKUs</strong><p>Value PKR 422K · supplier risk: NorthStar Imports</p></div><div class="queue-item" style="margin-top:8px"><span>Priority 2</span><strong>Rebalance Islamabad → Rawalpindi</strong><p>Move 46 units of adjacent inventory before order approval.</p></div></article></div>`, 'Inventory Risk')}
function investigations(){return shell(`<section class="title-row"><div><h1 class="title">Investigations & approvals</h1><p class="sub">Turn verified insights into accountable, approval-gated operational decisions.</p></div><button class="btn">New investigation</button></section><div class="grid wide"><article class="card"><h3>Open investigations</h3><p class="helper">Evidence remains linked through the complete decision lifecycle.</p><table><thead><tr><th>Investigation</th><th>Priority</th><th>Owner</th><th>Status</th></tr></thead><tbody>${[['Investigate Consumer Electronics margin erosion','High','Amina Siddiqui','In review'],['Review Islamabad returns anomaly','High','Hamza Khan','Open'],['Validate NorthStar delivery exception','Critical','Amina Siddiqui','Pending approval'],['Slow-moving stock disposal proposal','Medium','Branch Ops','Open']].map(r=>`<tr><td>${r[0]}</td><td><span class="tag warn">${r[1]}</span></td><td>${r[2]}</td><td><span class="tag">${r[3]}</span></td></tr>`).join('')}</tbody></table></article><article class="card"><h3>Approval request · pending</h3><p class="helper">Decision proposal linked to certified margin evidence.</p><div class="queue-item"><span>Approval gated</span><strong>Pause stackable promotions for selected SKUs</strong><p>Scope: Consumer Electronics · 17 SKUs · projected protected margin: PKR 310K</p></div><div class="check" style="margin-top:13px">Evidence attached from AI execution #0142</div><div class="check">Finance Analyst review required</div><div class="check">Action is not automatically executed</div><div style="display:flex;gap:8px;margin-top:16px"><button class="btn">Approve recommendation</button><button class="btn dark">Reject</button></div></article></div><div class="grid wide"><article class="card"><h3>Activity timeline</h3><div class="alert"><span class="severity high">10:18</span><div><b>AI answer linked with SQL evidence</b><p>Certified metrics: Gross margin, Revenue. SQL validation passed.</p></div></div><div class="alert"><span class="severity high">10:32</span><div><b>Investigation created by Amina Siddiqui</b><p>Priority set to High; Finance Analyst assigned.</p></div></div><div class="alert"><span class="severity high">10:41</span><div><b>Approval request submitted</b><p>Awaiting governed reviewer decision.</p></div></div></article><article class="card"><h3>Evidence & attachments</h3><p class="helper">External attachments are represented as a safe placeholder in this demo.</p><div class="queue-item"><strong>Certified metric evidence</strong><p>Revenue & gross margin calculation lineage</p></div><div class="queue-item" style="margin-top:8px"><strong>SQL validation log</strong><p>SELECT-only · source allowlists · row limit enforced</p></div></article></div>`, 'Investigations')}
function audit(){return shell(`<section class="title-row"><div><h1 class="title">Governance, users & audit</h1><p class="sub">A traceable record of human decisions, AI analysis, SQL validation, and exports.</p></div><div class="filters"><span class="filter">Last 30 days</span><span class="filter">All actors</span></div></section><div class="grid wide"><article class="card"><h3>Audit events</h3><p class="helper">Tamper-evident application event ledger</p><table><thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Resource</th><th>Result</th></tr></thead><tbody>${[['10:41','amina@opslens.demo','approval.request','Investigation #24','Logged'],['10:32','amina@opslens.demo','investigation.create','Investigation #24','Logged'],['10:18','admin@opslens.demo','ai.query','Execution #142','Validated'],['10:17','admin@opslens.demo','sql.validate','Query #142','Passed'],['09:04','admin@opslens.demo','export.dashboard','Overview','Logged']].map(r=>`<tr>${r.map((x,i)=>`<td>${i==4?`<span class="tag">${x}</span>`:x}</td>`).join('')}</tr>`).join('')}</tbody></table></article><article class="card"><h3>Access posture</h3><p class="helper">Role-based permissions and managed surfaces.</p>${[['Admin','Full workspace and governance','5 permissions'],['Operations Manager','Investigations and approval requests','3 permissions'],['Finance Analyst','Certified metrics and reports','2 permissions'],['Viewer','Read-only dashboard','1 permission']].map(r=>`<div class="alert"><span class="severity high">Role</span><div><b>${r[0]}</b><p>${r[1]} · ${r[2]}</p></div></div>`).join('')}</article></div><div class="grid wide"><article class="card"><h3>Data sources</h3><p class="helper">Connection and freshness status</p><table><thead><tr><th>Source</th><th>Type</th><th>Status</th><th>Last sync</th></tr></thead><tbody>${[['Retail warehouse','PostgreSQL','Healthy','8 min ago'],['Inventory snapshots','SFTP + dbt','Healthy','8 min ago'],['Sales POS feed','ERP connector','Healthy','12 min ago'],['Supplier PO feed','ERP connector','Delayed','93 min ago']].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td><span class="tag ${r[2]=='Delayed'?'warn':''}">${r[2]}</span></td><td>${r[3]}</td></tr>`).join('')}</tbody></table></article><article class="card"><h3>API keys</h3><p class="helper">Keys are scoped, non-recoverable, and auditable.</p><div class="queue-item"><strong>Demo reporting integration</strong><p>ops_live_•••••••• · last used 2 hours ago</p></div><button class="btn dark" style="margin-top:14px">Rotate key</button></article></div>`, 'Governance')}

function route(){let h=location.hash.replace('#',''); let app=$('#app'); if(!h||h==='overview')app.innerHTML=overview();else if(h==='ai-operations')app.innerHTML=copilot();else if(h==='inventory-risk')app.innerHTML=inventory();else if(h==='investigations')app.innerHTML=investigations();else if(h==='governance'||h==='data-sources')app.innerHTML=audit();else if(h==='landing')app.innerHTML=landing();else app.innerHTML=overview()}window.addEventListener('hashchange',route);route();</script></body></html>
