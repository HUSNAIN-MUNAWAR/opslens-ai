name: Bug report
description: Report a reproducible defect in the API, UI, docs, or demo workflow.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a problem. Please include enough detail for someone else to reproduce it locally.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: List the exact steps, commands, or API calls.
      placeholder: |
        1. Start the API with ...
        2. Open ...
        3. Submit ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python/Node versions, browser, and whether you used demo mode or Docker.
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Paste relevant output. Do not include secrets.
